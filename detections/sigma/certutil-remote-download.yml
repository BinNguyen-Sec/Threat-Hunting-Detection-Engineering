title: Suspicious Certutil File Download from Remote URL
id: 4cf9c8f1-7cd5-4f68-a860-c349a3289db6
status: experimental
description: Detects certutil used with URL-related switches to download a file.
references:
  - https://attack.mitre.org/techniques/T1105/
author: Bin Nguyen
date: 2026-07-01
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\certutil.exe'
  selection_cli:
    CommandLine|contains|all:
      - '-urlcache'
      - '-f'
    CommandLine|contains:
      - 'http://'
      - 'https://'
  condition: selection_image and selection_cli
falsepositives:
  - PKI administration or authorized certificate retrieval
level: high
tags:
  - attack.command-and-control
  - attack.t1105
